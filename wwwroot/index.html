<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PeopleHub HR System</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { text-align: center; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; }
    h1 { color: #2563eb; margin-bottom: 0.5rem; }
    p { color: #666; margin: 0.3rem 0; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .divider { border-top: 1px solid #e5e7eb; margin: 1rem 0; }
    .warning { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 4px; padding: 0.5rem; margin-top: 1rem; font-size: 0.85rem; color: #92400e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PeopleHub HR System</h1>
    <p>HR Management &amp; Payroll System</p>
    <div class="divider"></div>
    <p><strong>Gateway:</strong> <a href="http://localhost:8081">localhost:8081</a></p>
    <p><strong>PeopleHub App:</strong> <a href="http://localhost:8081/people-hub">/people-hub</a></p>
    <p><strong>API:</strong> <a href="http://localhost:8081/api/v1">/api/v1</a></p>
    <p><strong>Swagger:</strong> <a href="http://localhost:8081/swagger/index.html">/swagger/</a></p>
    <p><strong>Health:</strong> <a href="http://localhost:8081/health">/health</a></p>
    <div class="warning">
      <strong>Note:</strong> Default Web Site (port 80) runs other production apps and is not affected by PeopleHub deployment.
    </div>
  </div>
</body>
</html>
