<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeopleHub Status</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #f1f5f9; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px 48px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; max-width: 480px; }
    h1 { color: #0f172a; margin: 0 0 8px; }
    p { color: #64748b; margin: 4px 0; }
    a { display: inline-block; margin: 12px 8px 0; padding: 10px 18px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; }
    a.alt { background: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PeopleHub HR System</h1>
    <p>Service status and access links</p>
    <a href="http://localhost:8081/people-hub/">Open PeopleHub</a>
    <a class="alt" href="http://localhost:8081/health">Health Check</a>
    <a class="alt" href="http://localhost:8081/swagger/index.html">Swagger API Docs</a>
  </div>
</body>
</html>
